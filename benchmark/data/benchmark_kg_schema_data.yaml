    AOP relevant stressor:
      is_a: association
      represented_as: edge
      source: AOP
      target: stressor
      input_label: AOP_relevant_stressor
    chemical measured with bioassay:
      is_a: association
      represented_as: edge
      source: chemical
      target: bioassay
      input_label: chemical_measured_with_bioassay
    bioassay executed on model system:
      is_a: association
      represented_as: edge
      source: bioassay
      target: model system
